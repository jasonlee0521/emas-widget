name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o EMAS_Widget_CloudBuild.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        run: |
          echo "Searching for gradlew..."
          find project -name gradlew -type f
          PROJECT_DIR=$(dirname "$(find project -name gradlew -type f -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMAS-Widget-APK
          path: project/**/app-debug.apk
